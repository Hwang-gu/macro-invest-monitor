name: daily-update

on:
  schedule:
    # 앱·시세 데이터. 뉴스레터 발송은 morning-mail 워크플로가 담당합니다.
    # UTC 일~목 22:00/22:20 = 한국시간 월~금 07:00/07:20. 주말에는 돌지 않습니다.
    - cron: "0 22 * * 0-4"
    - cron: "20 22 * * 0-4"
  workflow_dispatch:
    inputs:
      send_mail:
        description: "뉴스레터 발송. 테스트도 반드시 허락받은 뒤에만 켜세요."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TED_SEND_MAIL: ${{ github.event_name != 'schedule' && inputs.send_mail && '1' || '0' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Collect and rebuild
        id: rebuild
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          TED_MANAGER_ID: ${{ secrets.TED_MANAGER_ID }}
          TED_MANAGER_PW: ${{ secrets.TED_MANAGER_PW }}
          TED_USER_ID: ${{ secrets.TED_USER_ID }}
          TED_USER_PW: ${{ secrets.TED_USER_PW }}
          TED_SYNC_TOKEN: ${{ secrets.TED_SYNC_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src --mode daily
      - name: Send keyword news email
        if: always() && steps.rebuild.outcome == 'success' && env.TED_SEND_MAIL == '1'
        continue-on-error: true
        env:
          TED_MANAGER_ID: ${{ secrets.TED_MANAGER_ID }}
          TED_MANAGER_PW: ${{ secrets.TED_MANAGER_PW }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.notify
      - name: Save data for next run
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/events.json data/ted_users.json data/ted_ads.json data/ted_newsletters.json data/ted_notices.json data/ads data/ted_sync_box.json data/reports/latest.json data/reports/app
          if [ -f data/reports/mail_sent.txt ]; then git add -f data/reports/mail_sent.txt; fi
          if [ -f data/reports/news_digest.json ]; then git add -f data/reports/news_digest.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "daily data $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 8
          done
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/reports/app

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
