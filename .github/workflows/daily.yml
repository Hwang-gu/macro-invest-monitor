name: daily-update

on:
  schedule:
    # 한국시간 매일 07:00 (미국 장 마감 이후)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Collect and rebuild
        env:
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          TED_MANAGER_ID: ${{ secrets.TED_MANAGER_ID }}
          TED_MANAGER_PW: ${{ secrets.TED_MANAGER_PW }}
          TED_USER_ID: ${{ secrets.TED_USER_ID }}
          TED_USER_PW: ${{ secrets.TED_USER_PW }}
        run: python -m src --mode daily
      - name: Save data for next run
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/events.json data/reports/latest.json data/reports/app
          git diff --cached --quiet || git commit -m "daily data $(date -u +%Y-%m-%d)"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/reports/app

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
