name: send-newsletter

on:
  workflow_dispatch:
    inputs:
      mail_only:
        description: "테스트 수신자 이메일. 앱 뉴스레터 신청자 한 명만 지정하세요."
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TED_SEND_MAIL: "1"
      TED_MAIL_TEST: "1"
      TED_MAIL_ONLY: ${{ inputs.mail_only }}
      TED_MANAGER_ID: ${{ secrets.TED_MANAGER_ID }}
      TED_MANAGER_PW: ${{ secrets.TED_MANAGER_PW }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mail deps
        run: python -m pip install --upgrade pip && python -m pip install requests python-dotenv lxml google-genai
      - name: Send one newsletter
        run: python -m src.notify
