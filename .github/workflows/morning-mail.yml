name: morning-mail

on:
  schedule:
    # 한국시간 평일. GitHub cron은 UTC.
    # 06:30 수집, 이후 같은 스냅샷으로 발송만 재시도합니다. 성공한 날은 한 번만 보냅니다.
    - cron: "30 21 * * 0-4" # 06:30 뉴스 수집
    - cron: "40 21 * * 0-4" # 06:40 발송
    - cron: "0 22 * * 0-4"  # 07:00
    - cron: "20 22 * * 0-4" # 07:20
    - cron: "40 22 * * 0-4" # 07:40
    - cron: "0 23 * * 0-4"  # 08:00
    - cron: "20 23 * * 0-4" # 08:20
    - cron: "40 23 * * 0-4" # 08:40
    - cron: "0 0 * * 1-5"   # 09:00
  workflow_dispatch:
    inputs:
      send_mail:
        description: "뉴스레터 발송. 테스트도 반드시 허락받은 뒤에만 켜세요."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: morning-mail
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TED_NEWS_FORCE: ${{ github.event.schedule == '30 21 * * 0-4' && '1' || '0' }}
      TED_SEND_MAIL: ${{ github.event_name == 'schedule' && github.event.schedule != '30 21 * * 0-4' && '1' || inputs.send_mail && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mail deps
        run: python -m pip install --upgrade pip && python -m pip install requests python-dotenv lxml google-genai holidays
      - name: Collect 06:30 news snapshot
        env:
          TED_MANAGER_ID: ${{ secrets.TED_MANAGER_ID }}
          TED_MANAGER_PW: ${{ secrets.TED_MANAGER_PW }}
        run: python -m src.news_digest --collect
      - name: Send keyword news email
        if: env.TED_SEND_MAIL == '1'
        continue-on-error: true
        env:
          TED_MANAGER_ID: ${{ secrets.TED_MANAGER_ID }}
          TED_MANAGER_PW: ${{ secrets.TED_MANAGER_PW }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.notify
      - name: Save snapshot and send mark
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/reports/news_digest.json ]; then git add -f data/reports/news_digest.json; fi
          if [ -f data/reports/mail_sent.txt ]; then git add -f data/reports/mail_sent.txt; fi
          git diff --cached --quiet && exit 0
          git commit -m "morning mail $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 8
          done
          git push
