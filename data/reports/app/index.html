<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Ted Investment"/>
  <meta name="theme-color" content="#070b14"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="logo.jpg"/>
  <link rel="apple-touch-icon" href="logo.jpg"/>
  <title>Ted Investment</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    @font-face {
      font-family: "Chosunilbo Myeongjo";
      src: url("fonts/ChosunNM.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
      unicode-range: U+AC00-D7A3, U+1100-11FF, U+3130-318F, U+A960-A97F, U+D7B0-D7FF, U+3000-303F, U+FF00-FFEF;
    }
    @font-face {
      font-family: "Arial";
      src: url("fonts/Arial.woff2") format("woff2"), local("Arial");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Arial";
      src: url("fonts/Arial-Bold.woff2") format("woff2"), local("Arial Bold"), local("Arial");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #070b14;
      color: #ffffff;
      font-family: Arial, "Chosunilbo Myeongjo", sans-serif;
    }
    body {
      display: flex; justify-content: center;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
    }
    .shell {
      width: 100%; max-width: 430px;
      min-height: calc(100vh - 32px);
      background: #0b1220;
      border: 1px solid #1c2a44;
      border-radius: 22px;
      padding: 22px 18px 28px;
    }
    h1, h2, p { margin: 0; }
    .brand { text-align: center; letter-spacing: .12em; font-size: 1.35rem; margin-bottom: 28px; }
    .logo {
      display: block;
      width: 96px; height: 96px;
      margin: 0 auto 14px;
      border-radius: 22px;
      object-fit: cover;
    }
    .brand-row {
      display: flex; align-items: center; gap: 10px;
      text-align: left; margin: 0; font-size: 1.15rem;
    }
    .brand-row .logo { width: 40px; height: 40px; margin: 0; border-radius: 10px; }
    label { display: block; font-size: .82rem; margin: 14px 0 6px; color: #d7dee8; }
    input, select, button {
      width: 100%; font-family: inherit; font-size: 1rem;
      border-radius: 10px; border: 1px solid #3a4d6b;
      background: #10192b; color: #fff; padding: 12px 12px;
    }
    button { cursor: pointer; }
    .primary { background: #1a3a6b; border-color: #2d5a9a; margin-top: 18px; }
    .ghost { background: transparent; margin-top: 10px; }
    .err { color: #ffb4b4; font-size: .85rem; min-height: 1.2em; margin-top: 8px; text-align: center; }
    .hidden { display: none !important; }
    .check-row {
      display: flex; align-items: center; gap: 10px;
      margin: 14px 0 4px;
    }
    .check-row input[type="checkbox"] {
      width: 18px; height: 18px; padding: 0; margin: 0;
      accent-color: #6ea2e6;
    }
    .check-row label { margin: 0; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 10px; }
    .top small { color: #b7c3d4; font-size: .78rem; }
    .top-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .top-actions button { width: auto; margin: 0; padding: 6px 10px; font-size: .8rem; }
    #app:not(.hidden) {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 72px);
    }
    #app.home .menus {
      flex: 1;
      justify-content: center;
      margin: 0;
    }
    .menus { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .menus button { text-align: center; letter-spacing: .16em; }
    .menus button.on { background: #1e4d8c; border-color: #6ea2e6; }
    .panel { line-height: 1.55; font-size: .95rem; }
    .panel p { margin: 0 0 12px; }
    #presentBody p, #futureBody p { text-indent: 1.15em; }
    .cal {
      margin: 0 0 22px;
      padding: 12px 10px 14px;
      border: 1px solid #2d5a9a;
      border-radius: 12px;
      background: #10192b;
    }
    .cal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 8px;
    }
    .cal-head button {
      width: auto; margin: 0; padding: 4px 12px; font-size: .9rem;
    }
    .cal-label { letter-spacing: .06em; font-size: .92rem; }
    .cal-week, .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;
    }
    .cal-week span { font-size: .72rem; color: #b7c3d4; padding: 4px 0; }
    .cal-grid button {
      width: 100%; margin: 0; padding: 8px 0; font-size: .82rem;
      background: transparent; border-color: transparent;
    }
    .cal-grid button.has { border-color: #3a5478; }
    .cal-grid button.on { background: #1e4d8c; border-color: #6ea2e6; }
    .cal-grid button:disabled { opacity: .28; cursor: default; }
    .brief-title {
      text-align: center; text-indent: 0 !important;
      letter-spacing: .06em; margin-bottom: 16px !important;
    }
    .rate-list, .score-box { text-indent: 0; list-style: none; padding: 0; margin: 0 0 16px; }
    .rate-list li, .score-row { padding: 5px 0; }
    .score-box h3 { font-size: .92rem; letter-spacing: .06em; margin: 0 0 8px; font-weight: normal; }
    .score-row { display: flex; justify-content: space-between; border-bottom: 1px solid #1c2a44; }
    .alloc-box {
      background: #152238;
      border: 1px solid #2d5a9a;
      border-radius: 12px;
      padding: 14px 14px 6px;
      margin: 18px 0 0;
    }
    .alloc-box h3 {
      text-align: center;
      text-indent: 0;
      font-size: 1rem;
      font-weight: normal;
      letter-spacing: .08em;
      margin: 0 0 10px;
    }
    .footnote { color: #b7c3d4; font-size: .78rem; text-indent: 0 !important; margin-top: 16px !important; }
    .chart-title {
      text-align: left;
      position: sticky; top: 0; z-index: 3;
      background: #0b1220;
      padding: 8px 2px 2px;
      font-size: .88rem;
      letter-spacing: .04em;
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .tv-last { font-size: .82rem; color: #9ad0ff; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .tv-readout {
      font-size: .72rem; color: #b7c3d4; min-height: 1.05em;
      margin: 0 2px 4px; font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .period-bar {
      display: flex; gap: 4px; margin: 2px 0 10px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .period-bar button {
      width: auto; flex: 0 0 auto; margin: 0; padding: 5px 9px;
      font-size: .74rem; letter-spacing: 0; border-radius: 7px;
    }
    .period-bar button.on { background: #1e4d8c; border-color: #6ea2e6; }
    .chart-scroll {
      overflow: hidden;
      margin: 0 0 12px;
      border: 1px solid #1c2a44;
      border-radius: 8px;
      background: #0d1524;
    }
    .chart {
      height: 168px; min-width: 0; width: 100%;
      touch-action: none;
    }
    .chart.issues { height: 120px; }
    .chart.compare { height: 188px; }
    .chart.group { height: 168px; }
    .js-plotly-plot, .js-plotly-plot .plotly, .js-plotly-plot .main-svg { touch-action: none; }
    .legend {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      font-size: .76rem; color: #c5d0de; margin: 0 2px 8px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
    .legend-item.off { opacity: .32; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: #10192b; border: 1px solid #3a4d6b; border-radius: 14px;
      padding: 22px 20px; width: min(360px, 100%); text-align: center;
    }
    .modal.form { text-align: left; }
    .modal.form h2 { text-align: center; font-size: 1.05rem; letter-spacing: .08em; margin-bottom: 8px; }
    .weights div, .user-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1c2a44; }
    .user-row { font-size: .82rem; gap: 8px; }
    .user-row > span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d7dee8;
    }
    .user-row button { width: auto; padding: 6px 10px; font-size: .82rem; margin: 0; }
    .user-row .row-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 52px; width: 100%; }
    .pw-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: auto; margin: 0; padding: 4px 8px; font-size: .75rem;
      border: 0; background: transparent; color: #b7c3d4;
    }
    .pw-toggle.eye {
      width: 36px; height: 36px; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .pw-toggle.eye svg { width: 20px; height: 20px; display: block; }
    .pw-toggle:hover { color: #fff; }
    .hint { color: #b7c3d4; font-size: .78rem; margin: 8px 0 12px; }
    .ok { color: #9ad0a8; font-size: .85rem; min-height: 1.2em; margin-top: 8px; text-align: center; }

    @media (min-width: 960px) {
      html, body { height: 100%; }
      body {
        align-items: center;
        min-height: 100vh;
        padding: 16px;
        background: #05080f;
      }
      .shell {
        display: flex;
        flex-direction: column;
        width: min(96vw, calc((100vh - 32px) * 16 / 9));
        max-width: none;
        min-height: 0;
        aspect-ratio: 16 / 9;
        height: auto;
        overflow: auto;
        padding: 32px 56px 40px;
        border-radius: 16px;
        border-color: #3a5478;
        box-shadow: 0 16px 48px rgba(0,0,0,.45);
      }
      #login:not(.hidden) {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        justify-items: center;
        width: 100%;
        gap: 24px 48px;
      }
      #login .brand { margin-bottom: 0; }
      #login .brand .logo { width: 128px; height: 128px; }
      #login .login-form { width: min(400px, 100%); }
      #app:not(.hidden) {
        flex: 1;
        min-height: 0;
        height: auto;
      }
      #app.home .menus {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        max-width: 220px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        gap: 36px;
        padding: 40px 0 56px;
      }
      #app.home .menus button {
        width: 100%;
        padding: 8px 14px;
        font-size: .84rem;
        height: auto;
        letter-spacing: .14em;
      }
      .menus {
        flex-direction: row;
        justify-content: center;
        gap: 20px;
        margin-bottom: 28px;
      }
      .menus button {
        flex: 0 0 auto;
        width: auto;
        min-width: 96px;
        padding: 8px 16px;
        font-size: .86rem;
        letter-spacing: .1em;
      }
      .top { margin-bottom: 20px; }
      .chart-scroll { overflow: hidden; }
      .chart { height: 200px; }
      .chart.issues { height: 140px; }
      .chart.compare { height: 220px; }
      .chart.group { height: 200px; }
      #present { display: flex; flex-direction: column; }
      #presentBody, #futureBody {
        display: grid;
        grid-template-columns: minmax(0, 1fr) min(300px, 30%);
        gap: 8px 36px;
        align-items: start;
      }
      #presentBody .brief-main, #futureBody .brief-main { grid-column: 1; }
      #presentBody .alloc-box, #futureBody .alloc-box {
        grid-column: 2;
        grid-row: 1;
        position: sticky;
        top: 0;
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section id="login">
      <div class="brand">
        <img class="logo" src="logo.jpg" alt="Ted Investment"/>
        Ted Investment
      </div>
      <div class="login-form">
      <label for="role">Qualification</label>
      <select id="role">
        <option value="Manager">Manager</option>
        <option value="User">User</option>
      </select>
      <label for="uid">ID</label>
      <input id="uid" autocomplete="username"/>
      <label for="pw">PW</label>
      <div class="pw-wrap">
        <input id="pw" type="password" autocomplete="current-password"/>
        <button class="pw-toggle eye" type="button" data-for="pw" aria-label="보기"></button>
      </div>
      <div class="check-row">
        <input id="autoSign" type="checkbox"/>
        <label for="autoSign">Auto sign in</label>
      </div>
      <div class="err" id="loginErr"></div>
      <div class="ok" id="loginOk"></div>
      <p class="hint" id="loginHint">Log in with the admin-provided ID and password, then change your password.</p>
      <button class="primary" id="loginBtn" type="button">Sign in</button>
      <button class="ghost" id="adminBtn" type="button">Information</button>
      </div>
    </section>

    <section id="app" class="hidden">
      <div class="top">
        <div>
          <div class="brand brand-row">
            <img class="logo" src="logo.jpg" alt="Ted Investment"/>
            <div>
              <div>Ted Investment</div>
              <small id="who"></small>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <button class="ghost hidden" id="userAddBtn" type="button">User</button>
          <button class="ghost" id="pwChangeBtn" type="button">비밀번호 변경</button>
          <button class="ghost" id="logoutBtn" type="button">Logout</button>
        </div>
      </div>
      <nav class="menus">
        <button type="button" data-tab="past">Past</button>
        <button type="button" data-tab="present">Present</button>
        <button type="button" data-tab="future">Future</button>
      </nav>
      <div id="past" class="panel hidden">
        <div class="period-bar" id="periodBar"></div>
        <div class="legend">
          <span class="legend-item"><span class="dot" style="background:#e07070"></span>전쟁</span>
          <span class="legend-item"><span class="dot" style="background:#c090e0"></span>질병</span>
          <span class="legend-item"><span class="dot" style="background:#3dcc7a"></span>신기술</span>
          <span class="legend-item"><span class="dot" style="background:#c8c8c8"></span>위기</span>
          <span class="legend-item"><span class="dot" style="background:#e0a050"></span>지정학</span>
          <span class="legend-item"><span class="dot" style="background:#5aa0ff"></span>정책</span>
        </div>
        <h3 class="chart-title">Issue Timeline</h3>
        <div class="chart-scroll"><div class="chart issues" id="chartIssues"></div></div>
        <h3 class="chart-title">Trend Comparison</h3>
        <div class="legend" id="compareLegend"></div>
        <div class="tv-readout" id="readCompare"></div>
        <div class="chart-scroll"><div class="chart compare" id="chartCompare"></div></div>
        <h3 class="chart-title">Policy Rates &amp; FX<span class="tv-last" id="lastRates"></span></h3>
        <div class="legend" id="ratesLegend"></div>
        <div class="tv-readout" id="readRates"></div>
        <div class="chart-scroll"><div class="chart group" id="chartRatesFx"></div></div>
        <h3 class="chart-title">Equity Indices<span class="tv-last" id="lastEquities"></span></h3>
        <div class="legend" id="equityLegend"></div>
        <div class="tv-readout" id="readEquities"></div>
        <div class="chart-scroll"><div class="chart group" id="chartEquities"></div></div>
        <h3 class="chart-title">Gold<span class="tv-last" id="lastGold"></span></h3>
        <div class="tv-readout" id="readGold"></div>
        <div class="chart-scroll"><div class="chart" id="chartGold"></div></div>
        <h3 class="chart-title">Bitcoin<span class="tv-last" id="lastBtc"></span></h3>
        <div class="tv-readout" id="readBtc"></div>
        <div class="chart-scroll"><div class="chart" id="chartBtc"></div></div>
      </div>
      <div id="present" class="panel hidden">
        <div class="cal">
          <div class="cal-head">
            <button type="button" id="calPrev" aria-label="Previous month">‹</button>
            <span class="cal-label" id="calLabel"></span>
            <button type="button" id="calNext" aria-label="Next month">›</button>
          </div>
          <div class="cal-week">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div id="presentBody"></div>
      </div>
      <div id="future" class="panel hidden">
        <div class="period-bar" id="futurePeriodBar"></div>
        <div id="futureBody"></div>
      </div>
    </section>
  </div>

  <div id="adminModal" class="modal-bg hidden">
    <div class="modal">
      <p>Manager : tedhyun25@naver.com</p>
      <button class="primary" id="closeAdmin" type="button">닫기</button>
    </div>
  </div>

  <div id="userModal" class="modal-bg hidden">
    <div class="modal form">
      <h2>User</h2>
      <div id="userList"></div>
      <label for="newUserId">ID</label>
      <input id="newUserId" autocomplete="off"/>
      <label for="newUserPw">First Password</label>
      <div class="pw-wrap">
        <input id="newUserPw" type="password" autocomplete="new-password"/>
        <button class="pw-toggle eye" type="button" data-for="newUserPw" aria-label="보기"></button>
      </div>
      <div class="err" id="userErr"></div>
      <div class="ok" id="userOk"></div>
      <button class="primary" id="addUserBtn" type="button">Add new account</button>
      <button class="ghost" id="closeUser" type="button">Back</button>
    </div>
  </div>

  <div id="pwModal" class="modal-bg hidden">
    <div class="modal form">
      <h2 id="pwModalTitle">비밀번호 변경</h2>
      <p class="hint" id="pwModalHint"></p>
      <label for="pwNew">새 비밀번호</label>
      <div class="pw-wrap">
        <input id="pwNew" type="password" autocomplete="new-password"/>
        <button class="pw-toggle" type="button" data-for="pwNew">보기</button>
      </div>
      <label for="pwNew2">새 비밀번호 확인</label>
      <div class="pw-wrap">
        <input id="pwNew2" type="password" autocomplete="new-password"/>
        <button class="pw-toggle" type="button" data-for="pwNew2">보기</button>
      </div>
      <div class="err" id="pwErr"></div>
      <div class="ok" id="pwOk"></div>
      <button class="primary" id="pwSaveBtn" type="button">변경</button>
      <button class="ghost" id="closePw" type="button">닫기</button>

    async function digest(text) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

    async function unlockBox(pw, box) {
      if (!box || !box.ct || !pw || !(window.crypto && crypto.subtle)) return "";
      const salt = b64ToBytes(box.salt);
      const iv = b64ToBytes(box.iv);
      const ct = b64ToBytes(box.ct);
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: Number(box.iter || 210000), hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

    async function lockBox(pw, text) {
      if (!pw || !text || !(window.crypto && crypto.subtle)) return null;
      const salt = crypto.getRandomValues(new Uint8Array(16));

      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 210000, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt"]
      );
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)));

    async function githubSaveUsers(list) {
      const token = currentWriteToken();
      if (!token) return false;
      const body = JSON.stringify(list, null, 2);
      const headersFor = (scheme) => ({
        Authorization: scheme + " " + token,
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      });
      const putOnce = async (headers, sha) => {
        const payload = {
          message: "update ted users",
          content: utf8ToB64(body),
          branch: "main"
        };
        if (sha) payload.sha = sha;
        return fetch(USERS_API, {
          method: "PUT",
          headers: Object.assign({ "Content-Type": "application/json" }, headers),
          body: JSON.stringify(payload)
        });
      };
      const tryPut = async (scheme) => {
        const headers = headersFor(scheme);
        let sha;
        try {
          const cur = await fetch(USERS_API, { headers });
          if (cur.ok) sha = (await cur.json()).sha;
        } catch {}
        let r = await putOnce(headers, sha);
        if (r.status === 409) {
          const cur = await fetch(USERS_API, { headers });
          if (cur.ok) sha = (await cur.json()).sha;
          r = await putOnce(headers, sha);
        }
        return r.ok;
      };
      try {
        if (await tryPut("Bearer")) return true;
        if (await tryPut("token")) return true;
      } catch {}
      try {
        const r = await fetch("https://api.github.com/repos/Hwang-gu/macro-invest-monitor/dispatches", {
          method: "POST",
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28"
          },
          body: JSON.stringify({ event_type: "ted-users", client_payload: { users: body } })
        });
        return r.status === 204 || r.ok;
      } catch {
        return false;
      }
    }

        minallowed: AXIS_X0,
        maxallowed: AXIS_X1,
        nticks: 3,
        tickformat: "%y.%m",
        ticks: "",
        tickfont: {size: 10, color: "#8a97ab"},
        showticklabels: true,
        showgrid: false,
        rangeslider: {visible: false},
        fixedrange: false
      };
    }

    function drawIssues() {
      const traces = (BOOT.events || []).map(ev => {
        const lane = Math.max(0, LANES.indexOf(ev.category));
        const pal = ISSUE[ev.category] || ISSUE.financial_crisis;
        return {
          type: "scatter",
          mode: "lines",
          x: [toLocalNoon(ev.start, 1), toLocalNoon(ev.end, 1)],
          y: [lane, lane],
          line: {width: 18, color: pal.bar},
          name: ev.name,
          hovertemplate: "<b>" + ev.name + "</b><br>" + (ev.category_ko || LANE_KO[ev.category] || "") + "<br>" + ev.start + " ~ " + ev.end + "<extra></extra>",
          showlegend: false
        };
      });
      Plotly.newPlot("chartIssues", traces, {
        paper_bgcolor: "#0d1524", plot_bgcolor: "#0d1524",
        font: {color: "#fff", family: "Arial, Chosunilbo Myeongjo, sans-serif", size: 11},
        margin: {l: 44, r: 8, t: 4, b: 20},
        dragmode: "pan",
        hovermode: "closest",
        showlegend: false,
        xaxis: monthAxis(),
        yaxis: {
          gridcolor: "#1c2a44", color: "#9aa8bc",
          tickmode: "array",
          tickvals: LANES.map((_, i) => i),
          ticktext: LANES.map(k => LANE_KO[k]),
          range: [LANES.length - 0.6, -0.6],
          fixedrange: true
        },
        autosize: true
      }, PLOT_CFG);
    }

    function lwOptions(dual) {
      const Type = (window.LightweightCharts && LightweightCharts.TickMarkType) || {};
      return {
        autoSize: true,
        layout: {
          background: {type: "solid", color: "#0d1524"},
          textColor: "#8a97ab",
          fontFamily: "Arial, sans-serif",
          fontSize: 10
        },
        grid: {
          vertLines: {visible: false},
          horzLines: {color: "rgba(28,42,68,.55)"}
        },
        rightPriceScale: {
          borderVisible: false,
          autoScale: true,
          entireTextOnly: true,
          ticksVisible: false,
          scaleMargins: {top: 0.02, bottom: 0.02}
        },
        leftPriceScale: {
          visible: !!dual,
          borderVisible: false,
          autoScale: true,
          entireTextOnly: true,
          ticksVisible: false,
          scaleMargins: {top: 0.02, bottom: 0.02}
        },
        timeScale: {
          borderVisible: false,
          timeVisible: false,
          secondsVisible: false,
          ticksVisible: false,
          rightOffset: 2,
          minBarSpacing: 0.6,
          fixRightEdge: true,
          lockVisibleTimeRangeOnResize: true,
          tickMarkFormatter: (time, tickMarkType) => {
            if (tickMarkType === Type.DayOfMonth || tickMarkType === Type.Time || tickMarkType === Type.TimeWithSeconds || tickMarkType === 2 || tickMarkType === 3 || tickMarkType === 4) {
              return "";
            }
            let year = 0, month = 0;
            if (typeof time === "string" && time.length >= 7) {
              year = Number(time.slice(0, 4));
              month = Number(time.slice(5, 7));
            } else if (time && time.year) {
              year = time.year;
              month = time.month;
            } else if (typeof time === "number") {
              const d = new Date(time * 1000);
              year = d.getUTCFullYear();
              month = d.getUTCMonth() + 1;
            }
            if (!year) return "";
            if (tickMarkType === Type.Year || tickMarkType === 0) return String(year).slice(2);
            return String(year).slice(2) + "." + String(month).padStart(2, "0");
          }
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Magnet,
          vertLine: {color: "#6ea2e6", width: 1, style: 2, labelBackgroundColor: "#1e4d8c"},
          horzLine: {color: "#6ea2e6", width: 1, style: 2, labelBackgroundColor: "#1e4d8c"}
        },
        handleScroll: {mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false},
        handleScale: {
          mouseWheel: false,
          pinch: true,
          axisPressedMouseMove: {time: true, price: false},
          axisDoubleClickReset: {time: true, price: true}
        }
      };
    }

    function applyVisibleRange(chart) {
      const r = visibleRange(currentPeriod);
      try {
        chart.timeScale().setVisibleRange(r);
        chart.priceScale("right").applyOptions({autoScale: true});
        chart.priceScale("left").applyOptions({autoScale: true});
      } catch (e) {}
    }

    function mountLineChart(id, specs, opts) {
      opts = opts || {};
      const el = $(id);
      const chart = LightweightCharts.createChart(el, lwOptions(opts.dual));
      const series = specs.map(s => {
        const scaleId = s.axis === "y2" ? "right" : (opts.dual && s.axis === "y" ? "left" : "right");
        const common = {
          color: s.color,
          lineWidth: specs.length === 1 ? 2 : 1.7,
          priceLineVisible: specs.length === 1,
          lastValueVisible: specs.length <= 2,
          crosshairMarkerVisible: true,
          priceScaleId: scaleId
        };
        const ser = (opts.area && specs.length === 1)
          ? chart.addAreaSeries(Object.assign({}, common, {
              lineColor: s.color,
              topColor: s.color + "55",
              bottomColor: s.color + "00"
            }))
          : chart.addLineSeries(common);
        ser.setData(lwData(opts.values ? opts.values(s) : (CHART[s.key] || [])));
        return ser;
      });
      const readout = opts.readout ? $(opts.readout) : null;
      chart.subscribeCrosshairMove(param => {
        if (!readout) return;
        if (!param || !param.time || !param.seriesData) {
          readout.textContent = "";
          return;
        }
        const bits = [String(param.time)];
        series.forEach((ser, i) => {
          const pt = param.seriesData.get(ser);
          if (pt && pt.value != null) bits.push(specs[i].name + " " + fmtNum(pt.value));
        });
        readout.textContent = bits.join(" · ");
      });
      applyVisibleRange(chart);
      lwCharts.push({chart, series, specs});
      return {chart, series};
    }

    function wirePeriods() {
      const bar = $("periodBar");
      bar.innerHTML = PERIODS.map(p =>
        `<button type="button" data-p="${p.id}" class="${p.id === currentPeriod ? "on" : ""}">${p.label}</button>`
      ).join("");
      bar.onclick = e => {
        const btn = e.target.closest("button");
        if (!btn) return;
        currentPeriod = btn.dataset.p;
        bar.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.p === currentPeriod));
        lwCharts.forEach(w => applyVisibleRange(w.chart));
        const el = $("chartIssues");
        if (el && el.data) Plotly.relayout(el, {"xaxis.range": monthAxis().range, "xaxis.autorange": false});
      };
    }

    let pastDrawn = false;
    function drawPast() {
      if (pastDrawn) {
        resizePast();
        return;
      }
      pastDrawn = true;
      if (!window.LightweightCharts) {
        drawIssues();
        return;
      }
      wirePeriods();
      drawIssues();
      const compareMounted = mountLineChart("chartCompare", COMPARE, {
        readout: "readCompare",
        values: s => scale01(CHART[s.key] || [])
      });
      fillLegend("compareLegend", COMPARE, (i, on) => compareMounted.series[i].applyOptions({visible: on}));
      const ratesMounted = mountLineChart("chartRatesFx", RATES_FX, {dual: true, readout: "readRates"});
      fillLegend("ratesLegend", RATES_FX, (i, on) => ratesMounted.series[i].applyOptions({visible: on}));
      const eqMounted = mountLineChart("chartEquities", EQUITIES, {dual: true, readout: "readEquities"});
      fillLegend("equityLegend", EQUITIES, (i, on) => eqMounted.series[i].applyOptions({visible: on}));
      mountLineChart("chartGold", [{key: "gold", name: "Gold", color: COLOR.gold}], {area: true, readout: "readGold"});
      mountLineChart("chartBtc", [{key: "bitcoin", name: "Bitcoin", color: COLOR.bitcoin}], {area: true, readout: "readBtc"});
      const us = lastNum("us_ffr");
      const kr = lastNum("kr_call");
      $("lastRates").textContent = [us != null ? "US " + fmtNum(us) + "%" : "", kr != null ? "KR " + fmtNum(kr) + "%" : ""].filter(Boolean).join("  ");
      $("lastEquities").textContent = lastNum("kospi") != null ? "KOSPI " + fmtNum(lastNum("kospi")) : "";
      $("lastGold").textContent = fmtNum(lastNum("gold"));
      $("lastBtc").textContent = fmtNum(lastNum("bitcoin"));
      requestAnimationFrame(() => {
        lwCharts.forEach(w => applyVisibleRange(w.chart));
        resizePast();
      });
    }

    function showHome() {
      ["past","present","future"].forEach(t => $(t).classList.add("hidden"));
      document.querySelectorAll(".menus button").forEach(b => b.classList.remove("on"));
      $("app").classList.add("home");
    }

    async function loadPresentDates() {
      try {
        const res = await fetch("archive/dates.json", { cache: "no-store" });
        if (!res.ok) return;
        const extra = await res.json();
        if (Array.isArray(extra)) presentDates = [...new Set(presentDates.concat(extra.map(String)))].sort();
      } catch {}
    }
    function dateSet() {
      return new Set(presentDates);
    }
    function shiftMonth(ym, delta) {
      const [y, m] = ym.split("-").map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function renderCal() {
      const [y, m] = calCursor.split("-").map(Number);
      $("calLabel").textContent = y + "." + String(m).padStart(2, "0");
      const first = new Date(y, m - 1, 1);
      const start = first.getDay();
      const days = new Date(y, m, 0).getDate();
      const have = dateSet();
      const cells = [];
      for (let i = 0; i < start; i++) cells.push("<span></span>");
      for (let day = 1; day <= days; day++) {
        const key = calCursor + "-" + String(day).padStart(2, "0");
        const on = selectedPresent === key ? " on" : "";
        const has = have.has(key);
        cells.push(
          `<button type="button" data-day="${key}" class="${has ? "has" : ""}${on}" ${has ? "" : "disabled"}>${day}</button>`
        );
      }
      $("calGrid").innerHTML = cells.join("");
      $("calGrid").querySelectorAll("button[data-day]").forEach(btn => {
        btn.onclick = () => showPresentDate(btn.dataset.day);
      });
    }
    function presentHtml(data, weights) {
      return renderPresent(data) + weightsHtml(weights);
    }
    async function showPresentDate(day) {
      selectedPresent = day;
      renderCal();
      if (day === String(BOOT.asof || "").slice(0, 10)) {
        $("presentBody").innerHTML = presentHtml(BOOT.present, BOOT.weights);
        return;
      }
      $("presentBody").innerHTML = "<p class='hint'>불러오는 중...</p>";
      try {
        const res = await fetch("archive/" + day + ".json", { cache: "no-store" });
        if (!res.ok) throw new Error("missing");
        const data = await res.json();
        $("presentBody").innerHTML = presentHtml(data.present, data.weights);
      } catch {
        $("presentBody").innerHTML = "<p class='hint'>이 날짜의 리포트가 없습니다.</p>";
      }
    }
    $("calPrev").onclick = () => { calCursor = shiftMonth(calCursor, -1); renderCal(); };
    $("calNext").onclick = () => { calCursor = shiftMonth(calCursor, 1); renderCal(); };

    function openTab(name) {
      const btn = document.querySelector('.menus button[data-tab="' + name + '"]');
      if (btn && btn.classList.contains("on")) {
        showHome();
        return;
      }
      $("app").classList.remove("home");
      ["past","present","future"].forEach(t => $(t).classList.toggle("hidden", t !== name));
      document.querySelectorAll(".menus button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
      if (name === "past") setTimeout(drawPast, 80);
      if (name === "present") {
        loadPresentDates().then(() => {
          renderCal();
          if (selectedPresent) showPresentDate(selectedPresent);
        });
      }
    }

    function resizePast() {
      if ($("past").classList.contains("hidden")) return;
      const issues = $("chartIssues");
      if (issues && issues.data) Plotly.Plots.resize(issues);
    }
    window.addEventListener("resize", resizePast);
    if (window.matchMedia) {
      window.matchMedia("(min-width: 960px)").addEventListener("change", () => {
        if (!$("past").classList.contains("hidden")) setTimeout(drawPast, 80);
      });
    }

    function enter(role, id) {
      currentUser = { role, id };
      $("who").textContent = role;
      wireFuturePeriods();
      showFuture("1M");
      $("presentBody").innerHTML = "";
      selectedPresent = "";
      calCursor = toMonth(BOOT.asof);
      renderCal();
      $("userAddBtn").classList.toggle("hidden", role !== "Manager");
      $("pwChangeBtn").classList.toggle("hidden", role !== "User");
      loadWriteToken();
      show("app");
      showHome();
    }

    $("loginBtn").onclick = async () => {
      const id = $("uid").value.trim();
      const pw = $("pw").value;
      $("loginOk").textContent = "";
      let acc = null;
      try { acc = await matchAccount(id, pw); }
      catch { $("loginErr").textContent = "로그인 구성을 확인할 수 없습니다. 페이지를 새로고침해 주세요."; return; }
      if (!acc) {
        $("loginErr").textContent = "ID / PW 를 확인해 주세요.";
        return;
      }
      $("loginErr").textContent = "";
      $("role").value = acc.role;
      const h = await digest(acc.role + "|" + acc.id + "|" + pw);
      if ($("autoSign").checked) saveAuto(acc.role, acc.id, h);
      else clearAuto();
      if (acc.role === "Manager") {
        try { rememberWriteToken(await unlockSyncToken(pw)); }
        catch { loadWriteToken(); }
        enter(acc.role, acc.id);
        if (!currentWriteToken()) {
          $("userModal").classList.remove("hidden");
          $("userErr").textContent = "다른 기기와 맞추는 키가 열리지 않았습니다. 매니저 비밀번호를 다시 입력해 로그인해 주세요.";
          return;
        }
        if (mutableUsers().length) {
          let synced = false;
          try { synced = await saveUserStore(mutableUsers()); }
          catch {}
          if (!synced) {
            $("userModal").classList.remove("hidden");
            $("userErr").textContent = "폰의 계정 목록을 아직 GitHub에 올리지 못했습니다. 잠시 후 다시 매니저로 로그인해 주세요.";
          }
        }
        return;
      }
      const rec = userStore().find(a => String(a.id).toLowerCase() === String(acc.id).toLowerCase());
      try {
        if (rec && rec.wrap) rememberWriteToken(await unlockBox(pw, rec.wrap));
        else clearWriteToken();
      } catch { clearWriteToken(); }
      enter(acc.role, acc.id);
    };
    $("addUserBtn").onclick = async () => {
      const id = $("newUserId").value.trim();
      const pw = $("newUserPw").value;
      $("userErr").textContent = "";
      $("userOk").textContent = "";
      if (!id || !pw) { $("userErr").textContent = "ID와 First Password를 모두 입력해 주세요."; return; }
      if (allAuth().some(a => String(a.id).toLowerCase() === id.toLowerCase())) {
        $("userErr").textContent = "이미 있는 ID입니다.";
        return;
      }
      let hash;
      try { hash = await digest("User|" + id + "|" + pw); }
      catch { $("userErr").textContent = "저장할 수 없습니다. 페이지를 새로고침해 주세요."; return; }
      const list = mutableUsers();
      const row = { role: "User", id, hash, updated: Date.now() };
      const wrap = await wrapForPassword(pw);
      if (wrap) row.wrap = wrap;
      list.push(row);
      let synced = false;
      try { synced = await saveUserStore(list); }
      catch { $("userErr").textContent = "이 브라우저에 계정을 저장하지 못했습니다."; return; }
      $("newUserId").value = "";
      resetPwField("newUserPw");
      renderUsers();
      $("userOk").textContent = synced
        ? "계정을 만들었습니다."
        : "이 기기에는 저장됐습니다. 다른 기기에도 바로 쓰려면 매니저 비밀번호로 다시 로그인해 주세요.";
    };
    $("logoutBtn").onclick = () => {
      currentUser = null;
      clearWriteToken();
      clearAuto();
      $("autoSign").checked = false;
      $("userModal").classList.add("hidden");
      $("pwModal").classList.add("hidden");
      show("login");
    };
    $("userAddBtn").onclick = () => {
      $("userErr").textContent = "";
      $("userOk").textContent = "";
      renderUsers();
      $("userModal").classList.remove("hidden");
    };
    $("closeUser").onclick = () => $("userModal").classList.add("hidden");
    $("userModal").onclick = (e) => { if (e.target.id === "userModal") $("userModal").classList.add("hidden"); };
    $("pwChangeBtn").onclick = () => {
      $("pwSaveBtn").disabled = false;
      openPwModal(null);
    };
    $("pwSaveBtn").onclick = async () => {
      const pw = $("pwNew").value;
      const pw2 = $("pwNew2").value;
      $("pwErr").textContent = "";
      $("pwOk").textContent = "";
      if ($("pwSaveBtn").disabled) return;
      if (!pw || !pw2) { $("pwErr").textContent = "새 비밀번호를 두 번 입력해 주세요."; return; }
      if (pw !== pw2) { $("pwErr").textContent = "새 비밀번호가 서로 다릅니다."; return; }
      const target = pwTarget || (currentUser && currentUser.role === "User" ? currentUser : null);
      if (!target || target.role === "Manager") {
        $("pwErr").textContent = "이 계정은 여기서 바꿀 수 없습니다.";
        return;
      }
      let synced = false;
      try { synced = await setUserPassword(target.id, pw); }
      catch {
        $("pwErr").textContent = "저장할 수 없습니다. 페이지를 새로고침해 주세요.";
        return;
      }
      renderUsers();
      if (currentUser && currentUser.role === "User" && String(currentUser.id).toLowerCase() === String(target.id).toLowerCase()) {
        const h = await digest("User|" + target.id + "|" + pw);
        const auto = autoRecord();
        if (auto && auto.role === "User" && String(auto.id).toLowerCase() === String(target.id).toLowerCase()) {
          saveAuto("User", target.id, h);
        }
      }
      if (!synced) {
        $("pwErr").textContent = "이 기기에는 바뀌었습니다. 다른 기기에도 쓰려면 매니저로 한 번 로그인해 주세요.";
        return;
      }
      $("pwOk").textContent = pwTarget
        ? "변경했습니다. 상대에게 새 비밀번호를 알려 주세요."
        : "변경했습니다. 다른 기기에서도 새 비밀번호로 로그인할 수 있습니다.";
    };
    $("closePw").onclick = () => {
      $("pwModal").classList.add("hidden");
      $("pwSaveBtn").disabled = false;
    };
    $("pwModal").onclick = (e) => {
      if (e.target.id === "pwModal") {
        $("pwModal").classList.add("hidden");
        $("pwSaveBtn").disabled = false;
      }
    };
    $("adminBtn").onclick = () => $("adminModal").classList.remove("hidden");
    $("closeAdmin").onclick = () => $("adminModal").classList.add("hidden");
    $("adminModal").onclick = (e) => { if (e.target.id === "adminModal") $("adminModal").classList.add("hidden"); };
    document.querySelectorAll(".menus button").forEach(b => b.onclick = () => openTab(b.dataset.tab));
    $("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
    $("uid").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
    $("newUserPw").addEventListener("keydown", e => { if (e.key === "Enter") $("addUserBtn").click(); });
    $("pwNew2").addEventListener("keydown", e => { if (e.key === "Enter") $("pwSaveBtn").click(); });
    wirePwToggles();

    try {
      const url = new URL(location.href);
      ["join", "ted", "req"].forEach(k => url.searchParams.delete(k));
      const clean = url.pathname + url.search + url.hash;
      if (clean !== location.pathname + location.search + location.hash) history.replaceState({}, "", clean || url.pathname);
    } catch {}

    try { localStorage.removeItem("ted_auto_sign_legacy"); } catch {}
    refreshShared().finally(() => {
      const saved = autoRecord();
      const savedOk = saved && allAuth().some(a =>
        a.role === saved.role
        && String(a.id).toLowerCase() === String(saved.id).toLowerCase()
        && a.hash === saved.hash
      );
      if (savedOk) {
        $("autoSign").checked = true;
        $("uid").value = saved.id || "";
        $("role").value = saved.role || "User";
        enter(saved.role, saved.id);
        if (saved.role === "Manager" && currentWriteToken() && mutableUsers().length) {
          saveUserStore(mutableUsers()).catch(() => {});
        }
        return;
      }
      if (saved && !savedOk) clearAuto();
      show("login");
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=20");
  </script>
</body>
</html>
